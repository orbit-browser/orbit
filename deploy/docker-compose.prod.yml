# Orbit 공용 서버 묶음. 사용법과 운영 절차는 docs/deploy.md.
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# postgres·qdrant·backend 는 내부 네트워크에만 있고, 밖으로는 caddy 의 80·443만 연다.
name: ${COMPOSE_PROJECT_NAME:-orbit}

services:
  postgres:
    image: postgres:16.14
    restart: unless-stopped
    environment:
      POSTGRES_USER: orbit
      POSTGRES_DB: orbit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit -d orbit -q"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  qdrant:
    # 버전은 백엔드 qdrant-client(1.19)와 호환되는 서버로 고정한다.
    image: qdrant/qdrant:v1.18.2
    restart: unless-stopped
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrantdata:/qdrant/storage
    networks: [internal]

  backend:
    build: ../backend
    image: orbit-backend:${ORBIT_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.production
    environment:
      # 접속 주소는 compose 가 정한다. .env.production 의 같은 키보다 우선한다.
      DATABASE_URL: postgresql+asyncpg://orbit:${POSTGRES_PASSWORD}@postgres:5432/orbit
      QDRANT_URL: http://qdrant:6333
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks: [internal]

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      ORBIT_DOMAIN: ${ORBIT_DOMAIN:?ORBIT_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    ports:
      # 리허설은 HTTP_PORT·HTTPS_PORT 로 다른 포트를 쓴다. 운영은 기본값 80·443.
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [backend]
    networks: [internal]

networks:
  internal: {}

volumes:
  pgdata:
  qdrantdata:
  caddydata:
  caddyconfig:
